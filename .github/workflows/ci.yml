name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-test-build:
    name: Web test/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build

  server-test:
    name: Server test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  protocol-validation:
    name: Protocol validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci
        working-directory: protocol
      - run: npm test
        working-directory: protocol

  ios-test:
    name: iOS test/build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify release toolchain
        shell: bash
        run: |
          for candidate in /Applications/Xcode*.app; do
            version=$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version | awk '/^Xcode / {print $2}')
            if [[ "${version%%.*}" =~ ^[0-9]+$ ]] && (( ${version%%.*} >= 26 )); then
              export DEVELOPER_DIR="$candidate/Contents/Developer"
              break
            fi
          done
          bash ios/teraformingmars2/scripts/validate_release_toolchain.sh
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-$(xcode-select -p)}" >> "$GITHUB_ENV"
      - name: iOS unit and UI tests
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild \
            -project ios/teraformingmars2/teraformingmars2.xcodeproj \
            -scheme teraformingmars2 \
            -destination "platform=iOS Simulator,id=$device_id" \
            test
      - name: Unsigned Release build
        run: |
          xcodebuild \
            -project ios/teraformingmars2/teraformingmars2.xcodeproj \
            -scheme teraformingmars2 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
